name: Otomatik TÜİK Enflasyon Güncelleyici

on:
  schedule:
    - cron: '15 7,8 3-7 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python update_tufe.py
      - run: |
          git config --global user.name "SBS Hukuk Enflasyon Botu"
          git config --global user.email "bot@sbshukuk.local"
          git add tufe-rates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "TÜİK Güncel Kira Artış Oranı Eklendi [Otomatik]" && git push)
